# Положить как /etc/nginx/sites-available/printcare.conf
# и slинковать: ln -s /etc/nginx/sites-available/printcare.conf /etc/nginx/sites-enabled/
# Затем: sudo nginx -t && sudo systemctl reload nginx
# После — certbot за TLS: sudo certbot --nginx -d printcare.example.com

server {
    listen 80;
    listen [::]:80;
    server_name printcare.example.com;

    # Перевод на HTTPS, после установки сертификата certbot допишет ниже свой блок.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name printcare.example.com;

    # certbot подставит сюда свои пути после `sudo certbot --nginx -d printcare.example.com`
    # ssl_certificate     /etc/letsencrypt/live/printcare.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/printcare.example.com/privkey.pem;

    client_max_body_size 20m;

    # Webhook Telegram — длинный response допустим
    location /api/messenger/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
